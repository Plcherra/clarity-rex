<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="See your money clearly. Talk to Rex like he actually knows your life.">
  <meta name="theme-color" content="#081827">
  <meta name="clarity-web-build" content="BUILD_NUMBER_PLACEHOLDER">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clarity">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Clarity</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #081827;
      color: #e8eef4;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #clarity-boot-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: #081827;
    }
    #clarity-boot-loader p {
      margin: 0;
      opacity: 0.85;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      // If email confirm landed on the web PWA (wrong Site URL / redirect),
      // hand off into the installed native app before Flutter boots.
      var params = new URLSearchParams(window.location.search);
      var hash = window.location.hash || '';
      var hasAuthCallback =
        params.has('code') ||
        params.has('token_hash') ||
        hash.indexOf('access_token=') !== -1 ||
        hash.indexOf('type=signup') !== -1;
      if (!hasAuthCallback) return;
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent || '');
      if (!isMobile) return;
      var suffix = window.location.search + window.location.hash;
      window.location.replace('io.goclarity.clarity://login-callback' + suffix);
    })();
  </script>
  <div id="clarity-boot-loader" aria-live="polite">
    <p>Loading Clarity…</p>
    <p style="font-size:12px;opacity:.65">This may take a moment on first visit.</p>
  </div>
  <!-- Required by supabase_flutter / passkeys_web on Flutter web (Corbado Passkeys SDK). -->
  <script src="passkeys_bundle.js" type="application/javascript" data-cfasync="false"></script>
  <!-- Plaid Link (P4): defer so CDN script cannot block Flutter boot on Cloudflare. -->
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js" defer data-cfasync="false"></script>
  <!-- Custom boot logic lives in web/flutter_bootstrap.js (loader hide + boot errors). -->
  <script src="flutter_bootstrap.js" defer data-cfasync="false"></script>
</body>
</html>
