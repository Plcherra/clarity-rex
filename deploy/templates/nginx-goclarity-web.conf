# goclarity.app — landing (Astro) + Flutter PWA at /app/
# Copy to /etc/nginx/sites-available/ and symlink into sites-enabled.
# TLS certificates via certbot / Cloudflare origin cert.

server {
    listen 80;
    server_name goclarity.app www.goclarity.app app.goclarity.app;

    # Redirect legacy app subdomain to root-domain PWA path.
    if ($host = app.goclarity.app) {
        return 301 https://goclarity.app/app/$is_args$args;
    }

    if ($host = www.goclarity.app) {
        return 301 https://goclarity.app$request_uri;
    }

    return 301 https://goclarity.app$request_uri;
}

server {
    listen 443 ssl http2;
    server_name goclarity.app;

    # ssl_certificate /etc/letsencrypt/live/goclarity.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/goclarity.app/privkey.pem;

    root /var/www/goclarity/dist;
    index index.html;

    client_max_body_size 20m;

    # Astro landing + auth pages at site root.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Flutter web PWA (build with --base-href=/app/).
    location /app/ {
        alias /var/www/goclarity/dist/app/;
        try_files $uri $uri/ /app/index.html;
    }

    # Long-cache hashed Flutter assets; index.html stays short-lived.
    location ~* ^/app/(.*\.(js|css|wasm|png|jpg|jpeg|gif|ico|svg|woff2?))$ {
        alias /var/www/goclarity/dist/app/$1;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 443 ssl http2;
    server_name app.goclarity.app;

    return 301 https://goclarity.app/app/$is_args$args;
}
