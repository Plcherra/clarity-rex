# Clarity Rex API reverse proxy.
# Apply on the VPS with: bash scripts/vps_apply_nginx_voice_stream.sh
# That script patches the live site (keeps TLS) instead of blindly copying this file.
#
# Spoken voice requires the dedicated /voice/stream location with Upgrade headers.
# REST chat/TTS can work through location / alone; WebSocket STT cannot.
#
# Also install deploy/templates/nginx-clarity-rex-http-snippet.conf into
# /etc/nginx/conf.d/ so clarity_no_query is defined in http {}.

server {
    listen 80;
    server_name api.goclarity.app api.rexpilot.com;

    client_max_body_size 20m;

    # Streaming STT WebSocket — must stay ahead of location /.
    location /voice/stream {
        access_log /var/log/nginx/clarity-rex-voice.access.log clarity_no_query;
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Optional base-path clients (REX_BACKEND_URL=.../rex).
    location /rex/voice/stream {
        access_log /var/log/nginx/clarity-rex-voice.access.log clarity_no_query;
        rewrite ^/rex(/voice/stream)$ $1 break;
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
