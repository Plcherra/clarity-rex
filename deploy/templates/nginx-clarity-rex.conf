server {
    listen 80;
    server_name api.goclarity.app api.rexpilot.com;

    client_max_body_size 20m;

    # Never log JWTs / tickets that may appear on voice WebSocket query strings.
    log_format clarity_no_query '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $uri $server_protocol" $status '
                               '$body_bytes_sent "$http_referer" "$http_user_agent"';

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /voice/stream {
        access_log /var/log/nginx/clarity-rex-voice.access.log clarity_no_query;
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
