name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Guard against shipping backend secrets in mobile
        run: |
          if grep -RInE 'service_role|PLAID_SECRET|GROK_API_KEY|GROK_API|sk-[A-Za-z0-9]' lib; then
            echo "Forbidden secret patterns found under apps/mobile/lib" >&2
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare mobile env asset
        run: cp .env.example .env
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter tests
        run: flutter test

  rex-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rex-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall app
      - name: Pytest
        run: python -m pytest

  migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify user_insights migration exists
        run: test -f supabase/migrations/20260702000100_create_user_insights.sql
      - name: Verify user_insights RLS initplan migration exists
        run: test -f supabase/migrations/20260702000200_user_insights_rls_initplan.sql
      - name: Verify open_threads RLS initplan migration exists
        run: test -f supabase/migrations/20260712000100_open_threads_rls_initplan.sql
      - name: Verify commitments drop migration exists
        run: test -f supabase/migrations/20260703000200_drop_commitments.sql

  docs-canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block new non-canon docs under docs/
        run: bash scripts/verify_docs_canon.sh

  predeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run predeploy checks (no APK build)
        run: |
          cd apps/mobile
          cp .env.example .env
          flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test
          cd ../../services/rex-api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall app
          python -m pytest
